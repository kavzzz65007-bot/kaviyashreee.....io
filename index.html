    <title>ResumeLens - see which edits moved your resume score</title>
    <meta name="description" content="ResumeLens scores two versions of your resume, tests every edit on its own, and shows which changes helped or hurt. Runs 100% in your browser." />
    <meta name="theme-color" content="#070b14" />
    <!-- Apply the saved dark / white mode before the page paints (no flash). Dark is the default. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('resumelens:theme');
          if (t === 'light') {
            document.documentElement.setAttribute('data-theme', 'light');
            var m = document.querySelector('meta[name="theme-color"]');
            if (m) m.setAttribute('content', '#f2f5fa');
          }
        } catch (e) { /* storage blocked: stay in dark mode */ }
      })();
    </script>

    <style>
/* ==========================================================================
   style.css - all the styling for ResumeLens (hand-written, no framework).
   Sections: 1 base  2 layout  3 header/footer  4 buttons & forms  5 cards & chips
             6 home  7 login  8 tracker & results  9 3D bits  10 motion
   ========================================================================== */

/* ------------------------------ 1. base ---------------------------------- */
:root {
  color-scheme: dark;
  --font-sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;

  /* Colours that stay the same in both modes */
  --lens-400: #38bdf8;
  --up: #34d399;
  --down: #f87171;
  --violet: #a78bfa;

  /* ---- DARK mode (default) ---- */
  --bg: #070b14;
  --glow-a: rgba(56, 189, 248, 0.14);
  --glow-b: rgba(52, 211, 153, 0.1);
  --text: #e2e8f0;
  --text-hi: #ffffff;
  --text-hi2: #f1f5f9;
  --text-soft: #cbd5e1;
  --text-dim: #94a3b8;
  --text-faint: #74859b;
  --good-1: #6ee7b7;
  --good-2: #a7f3d0;
  --bad-1: #fca5a5;
  --bad-2: #fecaca;
  --warn-text: #fde68a;
  --info-text: #bae6fd;
  --violet-text: #c4b5fd;
  --accent-text: #7dd3fc;
  --eyebrow: rgba(125, 211, 252, 0.85);
  --grad-a: #7dd3fc;
  --grad-b: #6ee7b7;
  --line-faint: rgba(255, 255, 255, 0.05);
  --line: rgba(255, 255, 255, 0.1);
  --line-strong: rgba(255, 255, 255, 0.15);
  --ov-xs: rgba(255, 255, 255, 0.03);
  --ov-sm: rgba(255, 255, 255, 0.06);
  --ov-md: rgba(255, 255, 255, 0.11);
  --ov-lg: rgba(255, 255, 255, 0.14);
  --shade-1: rgba(0, 0, 0, 0.2);
  --shade-2: rgba(0, 0, 0, 0.25);
  --shade-3: rgba(0, 0, 0, 0.3);
  --glass-a: rgba(255, 255, 255, 0.055);
  --glass-b: rgba(255, 255, 255, 0.025);
  --glass-border: rgba(255, 255, 255, 0.09);
  --shadow-1: rgba(0, 0, 0, 0.7);
  --shadow-2: rgba(0, 0, 0, 0.5);
  --header-bg: rgba(7, 11, 20, 0.72);
  --field-bg: rgba(7, 11, 20, 0.65);
  --field-border: rgba(255, 255, 255, 0.12);
  --tick: rgba(255, 255, 255, 0.7);
  --mid-line: rgba(255, 255, 255, 0.3);
  --grid: rgba(255, 255, 255, 0.08);
  --dot-fill: #0b1220;
  --tab-on: rgba(255, 255, 255, 0.12);
  --scroll: #334155;
  --toast-bg: rgba(15, 23, 42, 0.96);
  --toast-bg-error: rgba(69, 10, 10, 0.94);
  --toast-good: #d1fae5;
  --toast-info: #e0f2fe;
  --toast-bad: #fee2e2;
}

/* ---- LIGHT (white) mode: switched on by the button in the header ---- */
:root[data-theme="light"] {
  color-scheme: light;
  --bg: #f2f5fa;
  --glow-a: rgba(14, 165, 233, 0.12);
  --glow-b: rgba(16, 185, 129, 0.09);
  --text: #1e293b;
  --text-hi: #0b1220;
  --text-hi2: #0f172a;
  --text-soft: #334155;
  --text-dim: #475569;
  --text-faint: #566579;
  --good-1: #047857;
  --good-2: #065f46;
  --bad-1: #b91c1c;
  --bad-2: #991b1b;
  --warn-text: #92400e;
  --info-text: #0369a1;
  --violet-text: #6d28d9;
  --accent-text: #0369a1;
  --eyebrow: #0369a1;
  --grad-a: #0284c7;
  --grad-b: #059669;
  --line-faint: rgba(15, 23, 42, 0.07);
  --line: rgba(15, 23, 42, 0.12);
  --line-strong: rgba(15, 23, 42, 0.2);
  --ov-xs: rgba(15, 23, 42, 0.035);
  --ov-sm: rgba(15, 23, 42, 0.055);
  --ov-md: rgba(15, 23, 42, 0.09);
  --ov-lg: rgba(15, 23, 42, 0.16);
  --shade-1: rgba(15, 23, 42, 0.04);
  --shade-2: rgba(15, 23, 42, 0.05);
  --shade-3: rgba(15, 23, 42, 0.07);
  --glass-a: rgba(255, 255, 255, 0.94);
  --glass-b: rgba(255, 255, 255, 0.8);
  --glass-border: rgba(15, 23, 42, 0.1);
  --shadow-1: rgba(15, 23, 42, 0.16);
  --shadow-2: rgba(15, 23, 42, 0.2);
  --header-bg: rgba(242, 245, 250, 0.85);
  --field-bg: #ffffff;
  --field-border: rgba(15, 23, 42, 0.24);
  --tick: rgba(15, 23, 42, 0.75);
  --mid-line: rgba(15, 23, 42, 0.35);
  --grid: rgba(15, 23, 42, 0.1);
  --dot-fill: #ffffff;
  --tab-on: #ffffff;
  --scroll: #94a3b8;
  --toast-bg: #ffffff;
  --toast-bg-error: #fef2f2;
  --toast-good: #065f46;
  --toast-info: #0c4a6e;
  --toast-bad: #991b1b;
}

*,
*::before,
*::after {
  box-sizing: border-box;
}

[hidden] {
  display: none !important;
}

html {
  scroll-behavior: smooth;
  -webkit-text-size-adjust: 100%;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: var(--font-sans);
  font-size: 16px;
  line-height: 1.5;
  color: var(--text);
  background-color: var(--bg);
  background-image:
    radial-gradient(1100px 600px at 12% -10%, var(--glow-a), transparent 60%),
    radial-gradient(900px 520px at 100% 0%, var(--glow-b), transparent 55%);
  background-attachment: fixed;
  overflow-x: hidden;
}

h1, h2, h3, h4, p, ul, ol, pre, figure, table {
  margin: 0;
}
ul, ol {
  padding: 0;
  list-style: none;
}
a {
  color: inherit;
  text-decoration: none;
}
button, input, textarea {
  font: inherit;
  color: inherit;
}
button {
  background: none;
  border: 0;
  padding: 0;
  cursor: pointer;
}
svg {
  display: block;
}
table {
  border-collapse: collapse;
}
strong {
  font-weight: 700;
}
details > summary {
  list-style: revert;
}

::selection {
  background: rgba(56, 189, 248, 0.35);
}

:focus-visible {
  outline: 2px solid var(--lens-400);
  outline-offset: 2px;
  border-radius: 6px;
}

* {
  scrollbar-width: thin;
  scrollbar-color: var(--scroll) transparent;
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  margin: -1px;
  padding: 0;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

/* Helpers used everywhere */
.muted { color: var(--text-dim); font-size: 0.9rem; }
.muted-xs { color: var(--text-dim); font-size: 0.75rem; line-height: 1.5; }
.dim { color: var(--text-dim); }
.strong { font-weight: 700; }
.tnum { font-variant-numeric: tabular-nums; color: var(--text-soft); }
.center { text-align: center; }
.nowrap { white-space: nowrap; }
.text-good { color: var(--good-1); font-size: 0.9rem; }
.text-bad { color: var(--bad-2); }
.stack { display: grid; gap: 1rem; }
.stack-sm { display: grid; gap: 0.5rem; }
.stack-lg { display: grid; gap: 1.5rem; }
.gap-top { margin-top: 1.25rem; }
.gap-top-lg { margin-top: 2rem; }
.row-gap { display: flex; flex-wrap: wrap; gap: 0.5rem; }
.center-row { justify-content: center; margin-top: 1.25rem; }
.center-fill { display: grid; place-items: center; width: 100%; height: 100%; }

/* ------------------------------ 2. layout -------------------------------- */
#app {
  position: relative;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}
.site-main {
  position: relative;
  z-index: 1;
  flex: 1 0 auto;
}
.container {
  width: 100%;
  max-width: 72rem;
  margin: 0 auto;
  padding: 2rem 1rem;
}
.grid { display: grid; gap: 1rem; }
.grid-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1.25rem; }
.grid-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.two-col { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1.5rem; align-items: start; }

.backdrop {
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
}
.backdrop * { pointer-events: none !important; }
.backdrop-fallback {
  position: absolute;
  inset: 0;
  opacity: 0.7;
  background-image:
    radial-gradient(2px 2px at 20% 30%, rgba(125, 211, 252, 0.7), transparent),
    radial-gradient(2px 2px at 70% 20%, rgba(125, 211, 252, 0.5), transparent),
    radial-gradient(1.5px 1.5px at 40% 70%, rgba(52, 211, 153, 0.6), transparent),
    radial-gradient(1.5px 1.5px at 85% 60%, rgba(125, 211, 252, 0.5), transparent),
    radial-gradient(2px 2px at 10% 85%, rgba(52, 211, 153, 0.5), transparent),
    radial-gradient(1.5px 1.5px at 60% 90%, rgba(125, 211, 252, 0.6), transparent);
}

/* --------------------------- 3. header & footer -------------------------- */
.site-header {
  position: sticky;
  top: 0;
  z-index: 30;
  border-bottom: 1px solid var(--line-faint);
  background: var(--header-bg);
  -webkit-backdrop-filter: blur(10px);
  backdrop-filter: blur(10px);
}
.header-inner {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 0.5rem;
  max-width: 72rem;
  margin: 0 auto;
  padding: 0.6rem 0.75rem;
}
.brand {
  display: flex;
  align-items: center;
  gap: 0.4rem;
  font-size: 1rem;
  font-weight: 800;
  letter-spacing: -0.01em;
  color: var(--text-hi);
  white-space: nowrap;
}
.brand-accent { color: var(--accent-text); }
.nav { display: flex; align-items: center; gap: 0.25rem; }
.nav-link {
  border-radius: 0.5rem;
  padding: 0.4rem 0.5rem;
  font-size: 0.875rem;
  font-weight: 600;
  white-space: nowrap;
  color: var(--text-dim);
  transition: color 0.15s, background-color 0.15s;
}
.nav-link:hover { color: var(--text-hi); background: var(--ov-sm); }
.nav-link.active { color: var(--text-hi); background: var(--ov-md); }
.nav .session-chip { display: none; max-width: 10rem; margin-left: 0.25rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.is-current { pointer-events: none; opacity: 0.6; }
.hide-sm { display: none; }

.footer {
  position: relative;
  z-index: 1;
  margin-top: 4rem;
  padding: 2rem 1rem;
  border-top: 1px solid var(--line-faint);
  text-align: center;
  font-size: 0.75rem;
  line-height: 1.6;
  color: var(--text-faint);
}
.footer p + p { margin-top: 0.25rem; }

/* ------------------------- 4. buttons and forms --------------------------- */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 0.5rem;
  border-radius: 0.75rem;
  padding: 0.6rem 1.1rem;
  font-weight: 600;
  font-size: 0.92rem;
  line-height: 1.2;
  border: 1px solid transparent;
  cursor: pointer;
  transition: transform 0.12s ease-out, background-color 0.15s, border-color 0.15s, opacity 0.15s, filter 0.15s;
  user-select: none;
}
.btn:hover:not(:disabled) { transform: translateY(-1px); }
.btn:active:not(:disabled) { transform: translateY(0); }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.btn-primary { color: #04121f; background: linear-gradient(135deg, #38bdf8, #34d399); }
.btn-primary:hover:not(:disabled) { filter: brightness(1.08); }
.btn-secondary { color: var(--text); background: var(--ov-sm); border-color: var(--line-strong); }
.btn-secondary:hover:not(:disabled) { background: var(--ov-md); }
.btn-ghost { color: var(--text-dim); background: transparent; }
.btn-ghost:hover:not(:disabled) { color: var(--text); background: var(--ov-sm); }
.btn-danger { color: var(--bad-2); background: rgba(248, 113, 113, 0.12); border-color: rgba(248, 113, 113, 0.4); }
.btn-danger:hover:not(:disabled) { background: rgba(248, 113, 113, 0.2); }
.btn.armed { color: var(--warn-text); background: rgba(251, 191, 36, 0.14); border-color: rgba(251, 191, 36, 0.5); }
.btn-sm { padding: 0.35rem 0.7rem; font-size: 0.8rem; border-radius: 0.6rem; }
.btn-lg { padding: 0.75rem 1.4rem; font-size: 1rem; }
.btn-block { width: 100%; padding: 0.7rem 1rem; }

.spinner {
  width: 1em;
  height: 1em;
  border-radius: 9999px;
  border: 2px solid currentColor;
  border-right-color: transparent;
  animation: spin 0.7s linear infinite;
  flex: none;
}

.field {
  width: 100%;
  border-radius: 0.75rem;
  border: 1px solid var(--field-border);
  background: var(--field-bg);
  color: var(--text);
  padding: 0.65rem 0.85rem;
  font-size: 0.95rem;
  line-height: 1.5;
  transition: border-color 0.15s, box-shadow 0.15s;
}
.field::placeholder { color: var(--text-faint); }
.field:focus { outline: none; border-color: var(--lens-400); box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2); }
.field[aria-invalid="true"] { border-color: var(--down); }
.field:disabled { opacity: 0.6; cursor: not-allowed; }
textarea.field { resize: vertical; min-height: 11rem; font-family: var(--font-mono); font-size: 0.82rem; }
.field-label { display: block; margin-bottom: 0.25rem; font-size: 0.875rem; font-weight: 600; color: var(--text); }

.alert {
  border-radius: 0.75rem;
  border: 1px solid;
  padding: 0.6rem 0.85rem;
  font-size: 0.85rem;
  line-height: 1.5;
}
.alert-error { color: var(--bad-2); background: rgba(248, 113, 113, 0.1); border-color: rgba(248, 113, 113, 0.4); }
.alert-warn { color: var(--warn-text); background: rgba(251, 191, 36, 0.09); border-color: rgba(251, 191, 36, 0.35); }
.alert-info { color: var(--info-text); background: rgba(56, 189, 248, 0.09); border-color: rgba(56, 189, 248, 0.32); }
.alert-success { color: var(--good-2); background: rgba(52, 211, 153, 0.1); border-color: rgba(52, 211, 153, 0.38); }

.check-label { display: inline-flex; align-items: center; gap: 0.5rem; margin-bottom: 0.75rem; font-size: 0.75rem; color: var(--text-dim); cursor: pointer; }
.check-label input { accent-color: var(--lens-400); }

/* --------------------------- 5. cards and chips -------------------------- */
.glass {
  background: linear-gradient(180deg, var(--glass-a), var(--glass-b));
  border: 1px solid var(--glass-border);
  border-radius: 1rem;
  box-shadow: 0 10px 40px -18px var(--shadow-1);
  -webkit-backdrop-filter: blur(10px);
  backdrop-filter: blur(10px);
}
.panel { padding: 1rem; }

/* CSS 3D tilt: attachTilt() writes --rx / --ry / --mx / --my from the pointer */
.tilt {
  --rx: 0deg;
  --ry: 0deg;
  --mx: 50%;
  --my: 50%;
  position: relative;
  transform: perspective(900px) rotateX(var(--rx)) rotateY(var(--ry));
  transition: transform 0.25s ease-out, box-shadow 0.25s ease-out;
  will-change: transform;
}
.tilt:hover { box-shadow: 0 24px 60px -24px rgba(56, 189, 248, 0.35), 0 10px 40px -18px var(--shadow-1); }
.tilt::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: inherit;
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.25s ease-out;
  background: radial-gradient(260px circle at var(--mx) var(--my), var(--ov-md), transparent 60%);
}
.tilt:hover::after { opacity: 1; }

.chip {
  display: inline-flex;
  align-items: center;
  gap: 0.3rem;
  border-radius: 9999px;
  padding: 0.12rem 0.6rem;
  font-size: 0.78rem;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  border: 1px solid transparent;
  white-space: nowrap;
}
.chip-up { color: var(--good-1); background: rgba(52, 211, 153, 0.12); border-color: rgba(52, 211, 153, 0.35); }
.chip-down { color: var(--bad-1); background: rgba(248, 113, 113, 0.12); border-color: rgba(248, 113, 113, 0.35); }
.chip-flat { color: var(--text-soft); background: rgba(148, 163, 184, 0.12); border-color: rgba(148, 163, 184, 0.3); }
.chip-info { color: var(--accent-text); background: rgba(56, 189, 248, 0.12); border-color: rgba(56, 189, 248, 0.35); }
.chip-big { padding: 0.25rem 0.8rem; font-size: 1rem; }
.chips { display: flex; flex-wrap: wrap; gap: 0.5rem; }
.chips .chip { white-space: normal; }

.section-heading { margin-bottom: 1rem; }
.eyebrow { font-size: 0.72rem; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--eyebrow); }
.section-title { font-size: 1.35rem; font-weight: 800; letter-spacing: -0.01em; color: var(--text-hi); }
.section-sub { margin-top: 0.25rem; font-size: 0.85rem; color: var(--text-dim); max-width: 46rem; }
.sub-title { margin-bottom: 0.5rem; font-size: 0.9rem; font-weight: 600; }

/* ------------------------------- 6. home --------------------------------- */
.home { padding-top: 2rem; }
.hero { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 0.9fr); gap: 2rem; align-items: center; }
.hero-chip { margin-bottom: 1rem; }
.hero-title { font-size: clamp(2.25rem, 6.2vw, 3.75rem); font-weight: 800; letter-spacing: -0.02em; line-height: 1.08; color: var(--text-hi); }
.grad-text { background: linear-gradient(90deg, var(--grad-a), var(--grad-b)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.hero-lead { margin-top: 1.25rem; max-width: 36rem; font-size: 1.05rem; line-height: 1.65; color: var(--text-soft); }
.hero-actions { display: flex; flex-wrap: wrap; gap: 0.75rem; margin: 1.75rem 0 0.75rem; }
.hero-side { width: 100%; max-width: 24rem; margin: 0 auto; }
.hero-ring { position: relative; width: 100%; aspect-ratio: 1 / 1; overflow: hidden; }
.hero-stage { position: absolute; inset: 0; }
.hero-overlay { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; pointer-events: none; }
.hero-num { font-size: clamp(3rem, 9vw, 3.75rem); font-weight: 800; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; line-height: 1; }
.hero-of { margin-top: 0.4rem; font-size: 0.75rem; color: var(--text-dim); }
.hero-caption { margin-top: 0.25rem; max-width: 9rem; font-size: 0.7rem; line-height: 1.25; color: var(--text-faint); }

.block { margin-top: 5rem; }
.card { padding: 1.25rem; }
.step-num {
  display: grid;
  place-items: center;
  width: 2.25rem;
  height: 2.25rem;
  border-radius: 9999px;
  font-weight: 800;
  color: #0f172a;
  background: linear-gradient(135deg, #38bdf8, #34d399);
}
.card-title { margin-top: 0.75rem; font-size: 1.1rem; font-weight: 700; color: var(--text-hi); }
.card-title.sm { margin-top: 0.5rem; font-size: 1rem; }
.card-text { margin-top: 0.25rem; font-size: 0.875rem; line-height: 1.6; color: var(--text-dim); }
.feature-icon { font-size: 1.5rem; line-height: 1; }

.table-wrap { overflow-x: auto; }
.rubric { width: 100%; min-width: 22rem; text-align: left; font-size: 0.875rem; }
.rubric thead tr { border-bottom: 1px solid var(--line); }
.rubric th, .rubric td { padding: 0.65rem 1rem; }
.rubric thead th { font-size: 0.72rem; font-weight: 600; text-transform: uppercase; color: var(--text-dim); }
.rubric tbody tr + tr { border-top: 1px solid var(--line-faint); }
.rubric tbody th { font-weight: 500; color: var(--text); }
.rubric .num { text-align: right; font-variant-numeric: tabular-nums; color: var(--text-soft); }
.rubric .total-row { background: var(--ov-xs); }
.rubric .total-row th, .rubric .total-row td { font-weight: 800; color: var(--text-hi); }

/* ------------------------------- 7. login -------------------------------- */
.login { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1.5rem; align-items: center; max-width: 64rem; padding-top: 3rem; }
.orb-host { position: relative; width: 100%; max-width: 28rem; height: 26rem; margin: 0 auto; }
.orb-status { margin-top: 0.25rem; text-align: center; font-size: 0.75rem; color: var(--text-faint); }
.orb-2d {
  width: clamp(6.5rem, 30vw, 11rem);
  aspect-ratio: 1 / 1;
  border-radius: 9999px;
  background: radial-gradient(circle at 35% 30%, #bae6fd, #38bdf8 40%, #0369a1 80%);
  box-shadow: 0 0 60px 8px rgba(56, 189, 248, 0.45), 0 0 0 14px rgba(56, 189, 248, 0.08), 0 0 0 30px rgba(56, 189, 248, 0.05);
  animation: orb-pulse 3.2s ease-in-out infinite;
  transition: background 0.4s, box-shadow 0.4s;
}
.orb-2d-error { background: radial-gradient(circle at 35% 30%, #fecaca, #f87171 40%, #991b1b 80%); box-shadow: 0 0 60px 8px rgba(248, 113, 113, 0.45), 0 0 0 14px rgba(248, 113, 113, 0.08); }
.orb-2d-ok { background: radial-gradient(circle at 35% 30%, #bbf7d0, #34d399 40%, #047857 80%); box-shadow: 0 0 60px 8px rgba(52, 211, 153, 0.45), 0 0 0 14px rgba(52, 211, 153, 0.08); }

.login-card { padding: 1.25rem; }
.login-title { font-size: 1.6rem; font-weight: 800; letter-spacing: -0.01em; color: var(--text-hi); }
.login-sub { margin-top: 0.25rem; font-size: 0.875rem; color: var(--text-dim); }
.tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 0.25rem; margin-top: 1rem; padding: 0.25rem; border-radius: 0.75rem; background: var(--shade-3); }
.tab { border-radius: 0.5rem; padding: 0.4rem 0.75rem; font-size: 0.875rem; font-weight: 600; color: var(--text-dim); transition: background-color 0.15s, color 0.15s; }
.tab:hover:not(:disabled) { color: var(--text-hi); }
.tab.on { color: var(--text-hi); background: var(--tab-on); }
.tab:disabled { cursor: not-allowed; }
.form-fields { display: grid; gap: 0.85rem; margin-top: 1rem; }
.form-fields .muted-xs { margin-top: 0.25rem; }
.pw-wrap { position: relative; }
.field-pw { padding-right: 4.25rem; }
.pw-toggle { position: absolute; top: 50%; right: 0.5rem; transform: translateY(-50%); height: 2rem; padding: 0 0.5rem; border-radius: 0.4rem; font-size: 0.75rem; font-weight: 600; color: var(--text-dim); }
.pw-toggle:hover { color: var(--text-hi); }
.login-card .stack-sm:empty { display: none; }
.login-card form > .stack-sm { margin-top: 0.75rem; }
.login-card form > .btn-block[type="submit"] { margin-top: 1rem; }
.or-line { display: flex; align-items: center; gap: 0.75rem; margin: 1rem 0; font-size: 0.75rem; color: var(--text-faint); }
.or-line span { flex: 1; height: 1px; background: var(--line); }
.local-note { margin-top: 1rem; line-height: 1.6; color: var(--text-faint); }

/* --------------------------- 8. tracker & results ------------------------ */
.tracker-head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 0.75rem; margin-bottom: 1.5rem; }
.tracker-intro { max-width: 42rem; }
.page-title { font-size: clamp(1.8rem, 5vw, 2.5rem); font-weight: 800; letter-spacing: -0.02em; line-height: 1.15; color: var(--text-hi); }
.tracker-intro .muted { margin-top: 0.4rem; }
.analyze-row { display: flex; flex-wrap: wrap; align-items: center; gap: 0.75rem; margin-top: 1.25rem; }
.tracker > .stack-sm { margin-top: 0.75rem; }
.results-host { margin-top: 2rem; scroll-margin-top: 5rem; }
.empty-results { display: grid; place-items: center; min-height: 10rem; padding: 2rem; text-align: center; }
.empty-title { font-size: 1.1rem; font-weight: 700; color: var(--text-hi2); }
.empty-results .muted { margin-top: 0.25rem; }

/* resume input */
.input-head { display: flex; flex-wrap: wrap; align-items: flex-start; justify-content: space-between; gap: 0.5rem; margin-bottom: 0.6rem; }
.input-label { font-size: 0.95rem; font-weight: 700; color: var(--text-hi2); }
.input-hint { font-size: 0.78rem; color: var(--text-dim); }
.counter { font-size: 0.75rem; color: var(--text-dim); font-variant-numeric: tabular-nums; }
.counter-over { color: var(--bad-1); font-weight: 600; }
.input-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem; margin-top: 0.6rem; }
.push-right { margin-left: auto; }
.stack-sm:empty { display: none; }
.input-actions + .stack-sm { margin-top: 0.6rem; }
.panel.dragging { border-color: var(--lens-400); box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.25); }

/* summary */
.summary-grid { display: grid; grid-template-columns: 1fr auto 1fr; gap: 1rem; align-items: center; justify-items: center; }
.summary-grid .center { display: grid; justify-items: center; }
.delta-col { display: grid; justify-items: center; gap: 0.25rem; }
.summary-line { margin-top: 1rem; text-align: center; font-size: 0.9rem; color: var(--text-soft); }
.summary-line strong { color: var(--text-hi); font-variant-numeric: tabular-nums; }
.summary-grid + .alert, .summary-grid + .summary-line, .summary-line + .alert, .summary-grid + .summary-line + .alert { margin-top: 1rem; }

.meter { position: relative; flex: none; max-width: 100%; }
.meter-svg { position: absolute; inset: 0; transform: rotate(-90deg); max-width: 100%; }
.meter-center { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
.meter-num { font-weight: 800; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; line-height: 1; }
.meter-sub { margin-top: 0.3rem; max-width: 7rem; font-size: 0.72rem; line-height: 1.2; color: var(--text-dim); }
.score-ring-stroke { transition: stroke-dashoffset 1.1s cubic-bezier(0.2, 0.8, 0.2, 1), stroke 0.4s; }

/* impact chart and edit rows */
.chart-box { position: relative; width: 100%; overflow: hidden; border-radius: 0.75rem; border: 1px solid var(--line); background: var(--shade-1); }
.chart-gl { height: 19rem; }
.chart-fallback { max-height: 22rem; overflow-y: auto; padding: 0.75rem; }
.chart-loading { display: grid; place-items: center; height: 100%; font-size: 0.85rem; color: var(--text-faint); }
.chart-foot { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 0.5rem; margin-top: 0.5rem; }
.legend { display: flex; flex-wrap: wrap; gap: 0.25rem 1rem; font-size: 0.75rem; color: var(--text-dim); }
.legend li { display: flex; align-items: center; gap: 0.35rem; }
.legend-words { margin-bottom: 0.75rem; color: var(--text-soft); gap: 0.35rem 1rem; }
.legend-words li { display: block; }
.swatch { display: inline-block; width: 0.65rem; height: 0.65rem; border-radius: 2px; }
.sw-up { background: var(--up); }
.sw-down { background: var(--down); }
.sw-neutral { background: var(--violet); }

.bars2d { display: grid; gap: 0.4rem; }
.bars2d-row { display: grid; grid-template-columns: minmax(4.5rem, 9rem) minmax(0, 1fr) 3.4rem; align-items: center; gap: 0.6rem; font-size: 0.78rem; }
.bars2d-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text-dim); }
.bars2d-track { position: relative; height: 1.1rem; border-radius: 0.35rem; background: var(--ov-xs); }
.bars2d-mid { position: absolute; left: 50%; top: -2px; bottom: -2px; width: 1px; background: var(--mid-line); }
.bars2d-bar { position: absolute; top: 2px; bottom: 2px; border-radius: 3px; }
.tone-up { background: var(--up); }
.tone-down { background: var(--down); }
.tone-neutral { background: var(--violet); }
.tone-flat { background: #94a3b8; }
.bars2d-value { text-align: right; font-weight: 700; font-variant-numeric: tabular-nums; }
.text-up { color: var(--good-1); }
.text-down { color: var(--bad-1); }
.text-neutral { color: var(--violet-text); }
.text-flat { color: var(--text-soft); }

.edit-list { display: grid; gap: 0.5rem; }
.edit-row { padding: 0.75rem; border-radius: 0.75rem; border: 1px solid var(--line); background: var(--ov-xs); }
.edit-row > * + * { margin-top: 0.4rem; }
.edit-row.is-regression { border-color: rgba(248, 113, 113, 0.45); background: rgba(239, 68, 68, 0.07); }
.edit-row.is-interaction { border-color: rgba(167, 139, 250, 0.32); background: rgba(139, 92, 246, 0.06); }
.row-head { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 0.5rem 0.75rem; }
.row-head .chip { flex: none; }
.row-label { flex: 1 1 14rem; min-width: 0; font-size: 0.875rem; font-weight: 500; color: var(--text-hi2); overflow-wrap: anywhere; }
.regression-box { display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem; margin-top: 0.6rem; padding: 0.5rem 0.75rem; border-radius: 0.5rem; background: rgba(239, 68, 68, 0.1); }
.regression-box p { flex: 1 1 12rem; min-width: 0; font-size: 0.75rem; font-weight: 600; color: var(--bad-2); }
.before-after { font-size: 0.75rem; }
.before-after summary { cursor: pointer; color: var(--text-dim); }
.before-after summary:hover { color: var(--text); }
.ba-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0.5rem; margin-top: 0.5rem; }
.ba-cell { padding: 0.5rem; border-radius: 0.5rem; background: var(--shade-3); min-width: 0; }
.ba-cell p { margin-bottom: 0.25rem; font-weight: 600; color: var(--text-dim); }
.ba-cell pre { font-family: var(--font-mono); white-space: pre-wrap; overflow-wrap: anywhere; color: var(--text-soft); }
.sum-line { margin-top: 0.75rem; padding: 0.6rem 0.75rem; border-radius: 0.75rem; background: var(--shade-2); font-size: 0.875rem; color: var(--text-soft); font-variant-numeric: tabular-nums; }
.sum-line strong { color: var(--text-hi); }

/* next best edits */
.next-list { display: grid; gap: 0.75rem; }
.next-item { display: flex; gap: 0.75rem; padding: 0.75rem; border-radius: 0.75rem; border: 1px solid var(--line); background: var(--ov-xs); }
.next-num { display: grid; place-items: center; flex: none; width: 1.75rem; height: 1.75rem; border-radius: 9999px; font-size: 0.85rem; font-weight: 700; color: var(--info-text); background: rgba(56, 189, 248, 0.15); }
.next-body { flex: 1; min-width: 0; }
.next-body .next-title { font-size: 0.875rem; font-weight: 600; color: var(--text-hi2); }
.next-item > .chip { align-self: flex-start; }

/* word-level highlight */
.words { max-height: 28rem; overflow-y: auto; padding: 0.75rem; border-radius: 0.75rem; border: 1px solid var(--line); background: var(--shade-2); font-family: var(--font-mono); font-size: 0.85rem; line-height: 1.9; }
.words p { overflow-wrap: anywhere; }
.words p + p { margin-top: 0.25rem; }
.w { border-radius: 0.3rem; padding: 0.05rem 0.2rem; margin: 0 -0.05rem; }
.w-up { background: rgba(52, 211, 153, 0.22); color: var(--good-2); box-shadow: inset 0 -2px 0 rgba(52, 211, 153, 0.9); }
.w-down { background: rgba(248, 113, 113, 0.22); color: var(--bad-2); box-shadow: inset 0 -2px 0 rgba(248, 113, 113, 0.9); }
.w-flat { text-decoration: underline dotted rgba(148, 163, 184, 0.8); text-underline-offset: 4px; }
.w-gone { text-decoration-line: line-through; text-decoration-thickness: 1.5px; opacity: 0.85; }
.ghost-line { border-left: 3px solid rgba(148, 163, 184, 0.5); padding-left: 0.6rem; background: rgba(148, 163, 184, 0.05); border-radius: 0 0.4rem 0.4rem 0; }

/* breakdown */
.breakdown { display: grid; gap: 1rem; }
.cat-skipped { padding: 0.75rem; border-radius: 0.75rem; border: 1px dashed var(--line-strong); }
.cat-name { font-size: 0.875rem; font-weight: 600; color: var(--text-hi2); }
.cat-skipped .cat-name { color: var(--text-soft); }
.cat-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 0.5rem; }
.cat-nums { display: flex; align-items: center; gap: 0.5rem; font-size: 0.875rem; font-variant-numeric: tabular-nums; color: var(--text-soft); }
.cat-nums strong { color: var(--text-hi); }
.progress { position: relative; height: 0.65rem; margin: 0.4rem 0; overflow: hidden; border-radius: 9999px; background: var(--ov-md); }
.progress-fill { position: absolute; top: 0; bottom: 0; left: 0; border-radius: 9999px; background: linear-gradient(90deg, #38bdf8, #34d399); transition: width 0.9s cubic-bezier(0.2, 0.8, 0.2, 1); }
.progress-tick { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--tick); }
.total-line { display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem; margin-top: 1rem; padding-top: 0.75rem; border-top: 1px solid var(--line); font-size: 0.875rem; color: var(--text-soft); }
.total-line strong { color: var(--text-hi); font-variant-numeric: tabular-nums; }
.total-line + .muted-xs { margin-top: 0.25rem; }

/* keywords & weak bullets */
.bullet-list { display: grid; gap: 0.75rem; }
.bullet-item { padding: 0.75rem; border-radius: 0.75rem; border: 1px solid var(--line); background: var(--ov-xs); }
.bullet-head { display: flex; flex-wrap: wrap; align-items: center; gap: 0.35rem; }
.bullet-text { margin-top: 0.4rem; font-size: 0.875rem; color: var(--text); overflow-wrap: anywhere; }
.bullet-tip { margin-top: 0.4rem; font-size: 0.75rem; color: var(--info-text); }
.bullet-list + .btn { margin-top: 0.75rem; }

/* versions */
.version-list { margin-top: 1rem; border: 1px solid var(--line); border-radius: 0.75rem; }
.version-row { display: flex; flex-wrap: wrap; align-items: center; gap: 0.4rem 0.75rem; padding: 0.6rem 0.75rem; font-size: 0.875rem; }
.version-row + .version-row { border-top: 1px solid var(--line-faint); }
.version-label { min-width: 2.25rem; font-weight: 700; color: var(--text-hi2); }
.version-actions { display: flex; flex-wrap: wrap; gap: 0.35rem; margin-left: auto; }
.timeline { width: 100%; height: auto; max-height: 18rem; }
.empty-box { padding: 1.5rem 1rem; border: 1px dashed var(--line-strong); border-radius: 0.75rem; text-align: center; font-size: 0.85rem; color: var(--text-dim); }
.version-list, .timeline, .empty-box, .tracker .section-heading + .alert { margin-top: 0.75rem; }
#timeline-title { margin-top: 0; }

/* error card + toast */
.error-card { max-width: 32rem; margin: 2.5rem auto; padding: 1.5rem; text-align: center; }
.error-card h2 { font-size: 1.25rem; font-weight: 700; color: var(--text-hi2); }
.error-card .muted { margin-top: 0.5rem; }
.error-detail { margin-top: 0.75rem; padding: 0.5rem; border-radius: 0.5rem; background: var(--shade-3); font-family: var(--font-mono); font-size: 0.75rem; color: var(--text-faint); overflow-wrap: anywhere; }
.toast-wrap { position: fixed; left: 0; right: 0; bottom: 1rem; z-index: 60; display: flex; justify-content: center; padding: 0 1rem; pointer-events: none; }
.toast { pointer-events: auto; max-width: 28rem; padding: 0.6rem 1rem; border-radius: 0.75rem; border: 1px solid; font-size: 0.875rem; font-weight: 500; box-shadow: 0 14px 40px var(--shadow-2); }
.toast-success { color: var(--toast-good); background: var(--toast-bg); border-color: rgba(52, 211, 153, 0.4); }
.toast-info { color: var(--toast-info); background: var(--toast-bg); border-color: rgba(56, 189, 248, 0.4); }
.toast-error { color: var(--toast-bad); background: var(--toast-bg-error); border-color: rgba(248, 113, 113, 0.5); }

/* ------------------------------ 9. 3D bits -------------------------------- */
.gl-canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.bar-labels { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
.bar-label { position: absolute; left: 0; top: 0; display: flex; flex-direction: column; align-items: center; gap: 1px; width: 84px; text-align: center; pointer-events: none; user-select: none; will-change: transform; }
.bar-label strong { font-size: 0.8rem; font-weight: 800; font-variant-numeric: tabular-nums; }
.bar-label span { display: block; width: 100%; font-size: 0.62rem; line-height: 1.15; color: var(--text-dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ----------------------------- 10. animation ------------------------------ */
.page-enter { animation: page-in 0.5s cubic-bezier(0.2, 0.8, 0.2, 1) both; }
.fade-in { animation: fade-in 0.4s ease-out both; }

@keyframes page-in {
  from { opacity: 0; transform: translateY(14px) scale(0.99); }
  to { opacity: 1; transform: none; }
}
@keyframes fade-in {
  from { opacity: 0; }
  to { opacity: 1; }
}
@keyframes spin {
  to { transform: rotate(360deg); }
}
@keyframes orb-pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.05); }
}

/* ------------------------------ responsive -------------------------------- */
@media (min-width: 640px) {
  .container { padding: 2rem 1.5rem; }
  .header-inner { gap: 0.75rem; padding: 0.6rem 1.5rem; }
  .brand { font-size: 1.15rem; gap: 0.5rem; }
  .nav { gap: 0.5rem; }
  .nav-link { padding: 0.4rem 0.75rem; }
  .hide-sm { display: inline-block; }
  .nav .session-chip { display: inline-flex; }
  .panel { padding: 1.5rem; }
  .chart-gl { height: 22rem; }
  .login-card { padding: 1.75rem; }
  .home { padding-top: 3.5rem; }
}

@media (max-width: 960px) {
  .hero { grid-template-columns: minmax(0, 1fr); }
  .grid-3 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .two-col { grid-template-columns: minmax(0, 1fr); }
}

@media (max-width: 820px) {
  .grid-2 { grid-template-columns: minmax(0, 1fr); }
  .login { grid-template-columns: minmax(0, 1fr); padding-top: 1.5rem; }
  .orb-host { height: 15rem; }
}

@media (max-width: 640px) {
  .grid-3 { grid-template-columns: minmax(0, 1fr); }
  .summary-grid { grid-template-columns: minmax(0, 1fr); }
  .ba-grid { grid-template-columns: minmax(0, 1fr); }
  .orb-host { height: 11rem; }
  .block { margin-top: 3.5rem; }
  .bars2d-row { grid-template-columns: minmax(3.5rem, 6rem) minmax(0, 1fr) 3rem; gap: 0.4rem; }
  .version-actions { margin-left: 0; }
}

/* Respect "reduce motion": no animations, no tilt, instant transitions. */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
    scroll-behavior: auto !important;
  }
  .tilt { transform: none !important; }
}

/* ============================================================================
   Dark / white mode extras
   (the colour variables themselves are at the top of this file)
   ========================================================================== */

/* soft colour change when the button is pressed */
body { transition: background-color 0.25s ease, color 0.25s ease; }
.site-header, .glass, .field, .btn { transition-property: background-color, border-color, color, box-shadow, filter, transform; transition-duration: 0.25s; }

/* the button in the header */
.theme-toggle {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 0.4rem;
  flex: none;
  height: 2.1rem;
  min-width: 2.1rem;
  padding: 0 0.55rem;
  border-radius: 0.6rem;
  border: 1px solid var(--line-strong);
  background: var(--ov-xs);
  color: var(--text-soft);
  font: inherit;
  font-size: 0.8rem;
  font-weight: 600;
  white-space: nowrap;
  cursor: pointer;
  transition: color 0.15s, background-color 0.15s, border-color 0.15s;
}
.theme-toggle:hover { color: var(--text-hi); background: var(--ov-md); }
.theme-toggle svg { flex: none; }
.theme-label { display: none; }
.i-moon { display: none; }
:root[data-theme="light"] .i-sun { display: none; }
:root[data-theme="light"] .i-moon { display: inline; }
@media (min-width: 900px) {
  .theme-label { display: inline; }
}

/* score numbers and rings get their colour from --c (set in JS) */
.meter-num, .hero-num { color: var(--c, #34d399); }
.meter-track { stroke: var(--grid); }

    return next;
  }
  function toggleTheme() {
    return setTheme(getTheme() === "light" ? "dark" : "light");
  }
  function initTheme() {
    const saved = storage.get(THEME_KEY);
    setTheme(saved === "light" ? "light" : "dark", { save: false });
  }

  // src/main.js
  window.__resumelensLoaded = true;
  var TITLES = {
    home: "ResumeLens - see which edits moved your resume score",
    login: "Sign in - ResumeLens",
    app: "Edit Impact Tracker - ResumeLens"
  };
  var toast = createToast();
  function logo() {
    const ns = "http://www.w3.org/2000/svg";
    const svg = document.createElementNS(ns, "svg");
    svg.setAttribute("width", "28");
    svg.setAttribute("height", "28");
    svg.setAttribute("viewBox", "0 0 64 64");
    svg.setAttribute("aria-hidden", "true");
    svg.innerHTML = '<defs><linearGradient id="logo-g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#38bdf8"/><stop offset="1" stop-color="#34d399"/></linearGradient></defs><circle cx="30" cy="30" r="15" fill="none" stroke="url(#logo-g)" stroke-width="7"/><path d="M42 42 L55 55" stroke="url(#logo-g)" stroke-width="7" stroke-linecap="round"/>';
    return svg;
  }
  var SUN_SVG = '<svg class="i-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
  var MOON_SVG = '<svg class="i-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';
  function themeToggle() {
    const button = h("button", { type: "button", class: "theme-toggle" });
    button.innerHTML = SUN_SVG + MOON_SVG + '<span class="theme-label"></span>';
    const label = button.querySelector(".theme-label");
    const sync = () => {
      const light = getTheme() === "light";
      const text = light ? "Dark mode" : "White mode";
      label.textContent = text;
      button.setAttribute("aria-label", `Switch to ${text.toLowerCase()}`);
      button.setAttribute("title", `Switch to ${text.toLowerCase()}`);
      button.setAttribute("aria-pressed", light ? "true" : "false");
    };
    sync();
    button.addEventListener("click", () => {
      toggleTheme();
      sync();
    });
    return button;
  }
  function renderHeader(route) {
    const sess = session.get();
    const navLink = (href, text, active, extra = "") => h("a", { href, class: `nav-link${active ? " active" : ""} ${extra}`.trim(), "aria-current": active ? "page" : null }, text);
    return h(
      "div",
      { class: "header-inner" },
      h("a", { href: "#/", class: "brand" }, logo(), h("span", null, "Resume", h("span", { class: "brand-accent" }, "Lens"))),
      h(
        "nav",
        { class: "nav", "aria-label": "Main" },
        navLink("#/", "Home", route === "home", "hide-sm"),
        navLink("#/app", "Tracker", route === "app"),
        themeToggle(),
        sess ? [
          h("span", { class: "chip chip-info session-chip", title: sess.guest ? "Guest profile (saved on this device)" : `Signed in as ${sess.username}` }, sess.guest ? "Guest" : sess.username),
          h(
            "button",
            {
              type: "button",
              class: "btn btn-ghost btn-sm nowrap",
              onClick: () => {
                session.logout();
                navigate("home");
              }
            },
            "Sign out"
          )
        ] : h("a", { href: "#/login", class: `btn btn-primary btn-sm nowrap${route === "login" ? " is-current" : ""}`, "aria-current": route === "login" ? "page" : null }, "Sign in")
      )
    );
  }
  function renderFooter() {
    return h(
      "footer",
      { class: "footer" },
      h("p", null, "ResumeLens runs entirely in your browser. Your resumes are never uploaded; they are only saved in this browser\u2019s local storage."),
      h("p", null, "Scores come from fixed, transparent rules - they estimate ATS-friendliness and are not a guarantee of how any real employer system will rank you.")
    );
  }
  function errorCard(error, retry) {
    const message = error && error.message ? String(error.message).slice(0, 200) : "";
    return h(
      "div",
      { class: "glass error-card", role: "alert" },
      h("h2", null, "Something went wrong"),
      h("p", { class: "muted" }, "This part of ResumeLens hit an unexpected problem. Your saved resumes are safe in your browser."),
      message ? h("p", { class: "error-detail" }, message) : null,
      h(
        "div",
        { class: "row-gap center-row" },
        h("button", { type: "button", class: "btn btn-primary", onClick: retry }, "Try again"),
        h("a", { class: "btn btn-secondary", href: "#/" }, "Back to home"),
        h("button", { type: "button", class: "btn btn-ghost", onClick: () => window.location.reload() }, "Reload page")
      )
    );
  }
  function start() {
    initTheme();
    const root = document.getElementById("app");
    if (!root) return;
    const backdrop = h("div", { class: "backdrop", "aria-hidden": "true" });
    const header = h("header", { class: "site-header" });
    const main = h("main", { class: "site-main", id: "main" });
    root.replaceChildren(backdrop, header, main, renderFooter(), toast.el);
    mountScene(backdrop, {
      fallback: () => h("div", { class: "backdrop-fallback" }),
      create: (THREE, el, onLost) => createBackdrop(THREE, el, { count: isNarrow() ? 70 : 150, reduced: prefersReducedMotion(), onLost })
    });
    let page = null;
    let shownRoute = null;
    function destroyPage() {
      if (page) {
        try {
          page.destroy();
        } catch {
        }
        page = null;
      }
    }
    function drawHeader() {
      try {
        header.replaceChildren(renderHeader(shownRoute || parseHash(window.location.hash)));
      } catch {
        header.replaceChildren(h("a", { href: "#/", class: "brand" }, "ResumeLens"));
      }
    }
    function show(route) {
      destroyPage();
      shownRoute = route;
      document.title = TITLES[route] || TITLES.home;
      drawHeader();
      let content;
      try {
        if (route === "login") page = createLoginPage();
        else if (route === "app") page = createTrackerPage({ toast });
        else page = createHomePage();
        content = page.el;
      } catch (error) {
        destroyPage();
        content = errorCard(error, () => show(route));
      }
      main.replaceChildren(h("div", { class: "page-enter" }, content));
      window.scrollTo(0, 0);
    }
    function onRoute() {
      const route = parseHash(window.location.hash);
      if (route === "app" && !session.get()) {
        navigate("login", { replace: true });
        return;
      }
      show(route);
    }
    window.addEventListener("hashchange", onRoute);
    session.subscribe(drawHeader);
    let lastNotice = 0;
    const notify = () => {
      const now = Date.now();
      if (now - lastNotice < 4e3) return;
      lastNotice = now;
      toast.show("Something unexpected happened. Your saved resumes are safe.", "error");
    };
    window.addEventListener("unhandledrejection", (event) => {
      event.preventDefault();
      notify();
    });
    window.addEventListener("error", (event) => {
      if (!event.error) return;
      notify();
    });
    onRoute();
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", start);
  else start();
})();

    </script>
  </body>
</html>
