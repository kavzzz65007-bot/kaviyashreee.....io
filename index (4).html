    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <div id="root"><div id="boot">Loading ResumeLens&hellip;</div></div>
